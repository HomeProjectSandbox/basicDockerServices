# Use postgres/example user/password credentials
version: '3.9'

services:

  db:
    image: postgres:17.4
    container_name: db
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: mypw
      POSTGRES_USER: myuser
    ports:
      - 8082:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:5.2.1
    container_name: adminer
    restart: always
    ports:
      - 8080:8080

  webserver:
    build:
      context: ./webserver  # Relative to the location of this compose.yaml
      dockerfile: Dockerfile
      args:
        GOBUILD_IMAGE: golang:1.24.2  # Replace with your desired base image
    container_name: webserver
    ports:
      - "8081:8080"  # Change as needed
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./webserver/config:/config  # Mount the local ./config directory to /config in the container